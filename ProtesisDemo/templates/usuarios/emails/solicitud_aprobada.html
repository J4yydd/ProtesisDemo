<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Solicitud de acceso aprobada</title>
</head>
<body style="font-family: Arial, sans-serif; color: #4a4a4a; line-height: 1.5;">
  <h1 style="color: #c2185b; font-size: 1.4rem;">{{ sistema }}</h1>
  <p>Hola {{ nombre }},</p>
  <p>Tu solicitud de acceso fue <strong>aprobada</strong>.</p>
  <p>Rol autorizado: <strong>{{ rol }}</strong></p>
  <p>Ya puedes iniciar sesión con Google usando este mismo correo: <strong>{{ correo }}</strong>.</p>
  <p>Atentamente,<br>{{ sistema }}</p>
</body>
</html>
