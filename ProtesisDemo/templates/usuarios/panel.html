{% extends "base.html" %}

{% block title %}Panel · SPMEP{% endblock %}

{% block content %}
<section class="card">
  <h1>Sesión iniciada</h1>
  <p class="lead">{{ nombre }}</p>
  <p class="hint">{{ correo }}</p>
  <p class="hint">Rol: {{ rol }}</p>
  {% if es_administrador %}
  <p class="hint"><a class="btn" href="{% url 'usuarios:administrar_usuarios' %}">Administrar usuarios</a></p>
  {% endif %}
  <p class="hint"><a class="btn sec" href="{% url 'usuarios:logout' %}">Cerrar sesión</a></p>
</section>
{% endblock %}
