{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SPMEP{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block layout %}
  <header class="top">
    <p class="logo"><strong>SPMEP</strong></p>
    {% if request.session.rol %}
    <p class="header-rol">{{ request.session.rol }}</p>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
</body>
</html>
